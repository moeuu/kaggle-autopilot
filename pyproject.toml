[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "kagglebot"
version = "0.1.0"
description = "Kaggle competition automation CLI (safe by default)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "kaggle==1.7.4.5",
    "catboost>=1.2.8",
    "torch>=2.9.1 ; platform_machine == 'arm64' or sys_platform != 'darwin'",
    "obonet>=1.1.1",
    "networkx>=3.6.1",
    "biopython>=1.86",
    "tqdm>=4.67.1",
    "jsonlines>=4.0.0",
    "numpy>=2.4.0",
    "scipy>=1.16.3",
    "transformers>=4.57.3",
    "peft>=0.18.0 ; platform_machine == 'arm64' or sys_platform != 'darwin'",
    "accelerate>=1.12.0 ; platform_machine == 'arm64' or sys_platform != 'darwin'",
    "torchvision>=0.24.1 ; platform_machine == 'arm64' or sys_platform != 'darwin'",
    "torchaudio>=2.9.1 ; platform_machine == 'arm64' or sys_platform != 'darwin'",
    "lightgbm>=4.6.0 ; platform_machine == 'arm64' or sys_platform != 'darwin'",
    "ultralytics>=8.3.0",
    "opencv-python-headless>=4.11.0.86",
    "xgboost>=3.2.0",
    "tabicl>=2.0.2",
    "timm>=1.0.25",
    "albumentations>=2.0.8",
    "torchmetrics>=1.8.2",
    "optuna>=4.7.0",
    "kornia>=0.8.2",
    "iterative-stratification>=0.1.9",
    "sacrebleu>=2.6.0",
    "soundfile>=0.13.1",
    "onnxruntime>=1.26.0",
    "pytabkit>=1.7.3",
    "bm25s>=0.3.9",
    "faiss-cpu>=1.14.2",
    "kaggle-environments>=1.29.3",
    "bitsandbytes>=0.49.2",
    "qwen-vl-utils>=0.0.14",
    "easyocr>=1.7.2",
    "onnx>=1.21.0",
    "onnx-tool>=1.0.1",
    "openpyxl>=3.1.5",
    "nltk>=3.9.4",
    "sentencepiece>=0.2.1",
]

[project.scripts]
kagglebot = "kagglebot.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "src/kagglebot/knowledge/__init__.py",
    "artifacts",
    "artifacts_*",
    "outputs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
exclude = ["src/kagglebot/knowledge/__init__.py"]

[tool.pytest.ini_options]
addopts = "-p no:launch_testing -p no:launch_ros -m 'not competition_artifact and not slow'"
markers = [
    "competition_artifact: tests generated competition artifact kernels/runtimes (opt-in)",
    "integration: requires Kaggle CLI + credentials (opt-in)",
    "slow: broad orchestration or runner suites; run with -m 'slow and not competition_artifact'",
]
