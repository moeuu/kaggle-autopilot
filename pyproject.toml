[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "kagglebot"
version = "0.1.0"
description = "Kaggle competition automation CLI (safe by default)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "kaggle==1.7.4.5",
    "catboost>=1.2.8",
    "torch>=2.9.1 ; platform_machine == 'arm64' or sys_platform != 'darwin'",
    "obonet>=1.1.1",
    "networkx>=3.6.1",
    "biopython>=1.86",
    "tqdm>=4.67.1",
    "jsonlines>=4.0.0",
    "numpy>=2.4.0",
    "scipy>=1.16.3",
    "transformers>=4.57.3",
    "peft>=0.18.0 ; platform_machine == 'arm64' or sys_platform != 'darwin'",
    "accelerate>=1.12.0 ; platform_machine == 'arm64' or sys_platform != 'darwin'",
    "torchvision>=0.24.1 ; platform_machine == 'arm64' or sys_platform != 'darwin'",
    "torchaudio>=2.9.1 ; platform_machine == 'arm64' or sys_platform != 'darwin'",
    "lightgbm>=4.6.0 ; platform_machine == 'arm64' or sys_platform != 'darwin'",
]

[project.scripts]
kagglebot = "kagglebot.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
exclude = ["src/kagglebot/knowledge/__init__.py"]

[tool.pytest.ini_options]
markers = [
    "integration: requires Kaggle CLI + credentials (opt-in)",
]
